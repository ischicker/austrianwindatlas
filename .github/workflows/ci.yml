name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package (dev extras, no DL/GPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests examples scripts

      - name: Pytest (unit)
        run: pytest tests/unit -q

      - name: Smoke import
        run: python -c "import austrianwindatlas as awa; print(awa.__version__)"

      - name: Run the end-to-end synthetic example (01)
        run: python examples/01_synthetic_end_to_end.py

      - name: Run Stage-1 + validation example (02)
        run: python examples/02_stage1_with_validation.py

      - name: Run Stage-2 extrapolation demo (03)
        run: python examples/03_stage2_extrapolation_demo.py

      - name: Run real-TAWES verification demo (04, warm cache, offline)
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/awa-xdg
        run: |
          mkdir -p "$XDG_CACHE_HOME/austrianwindatlas"
          cp tests/fixtures/klima_cache/klima_v2_1h_*.csv "$XDG_CACHE_HOME/austrianwindatlas/"
          pip install -q matplotlib
          python examples/04_reproduce_fig3_tawes_open.py --no-download

      - name: Check notebooks are in sync with their source scripts
        run: |
          pip install -q nbformat
          python notebooks/build_notebooks.py
          git diff --exit-code -- notebooks || {
            echo "notebooks/ is out of sync with examples/. Run 'python notebooks/build_notebooks.py' and commit."
            exit 1
          }

  benchmark:
    name: Benchmark regression
    # Only run on pushes to main (not PRs, not forks).  Benchmark noise on
    # PR feedback is more irritating than useful.  workflow_dispatch lets
    # maintainers refresh the baseline manually.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Opt-in while we shake out runner-to-runner jitter.  Flip to
    # required after a week of green runs (see issue #3).
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmark check
        run: |
          python scripts/benchmark_check.py \
            --baseline tests/benchmarks/baseline.json \
            --benchmark example_01 \
            --runs 3 \
            --warmup
