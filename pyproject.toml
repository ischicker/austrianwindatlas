[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "austrianwindatlas"
version = "0.1.0"
description = "Observation-constrained hourly wind climatology for Austria — reference implementation and companion library to Schicker et al. (2026, Climate)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Irene Schicker",   email = "irene.schicker@geosphere.at" },
    { name = "Konrad Andre" },
    { name = "Annemarie Lexer" },
    { name = "Stefan Janisch" },
    { name = "Nina Bisko" },
]
maintainers = [
    { name = "Irene Schicker", email = "irene.schicker@geosphere.at" },
]
keywords = [
    "wind-climatology", "wind-atlas", "alpine-terrain", "wind-energy",
    "spatial-interpolation", "hub-height-extrapolation", "austria",
    "observation-constrained", "EOF", "rPCA",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]

# Runtime dependencies pinned loosely at this stage; tightened as
# method modules land and we lock the compat matrix.
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "xarray>=2023.6",
    "netCDF4>=1.6",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# CPU-only PyTorch stack used by the Enhanced-MAE / Enhanced-WMSE / QN-GNN /
# Temporal-CNN modules. Install the GPU extra for CuPy and a CUDA-aware torch.
dl = [
    "torch>=2.1",
]
gpu = [
    "cupy-cuda12x>=13.0",
]
# Mapping, hillshade, plotting — used by the examples, not by the core library.
viz = [
    "matplotlib>=3.7",
    "cartopy>=0.22",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.7",
    "build>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage       = "https://github.com/ischicker/austrianwindatlas"
Repository     = "https://github.com/ischicker/austrianwindatlas"
Documentation  = "https://ischicker.github.io/austrianwindatlas"
"Bug Tracker"  = "https://github.com/ischicker/austrianwindatlas/issues"
"Paper (MDPI)" = "https://doi.org/10.3390/climate4613178"

[tool.setuptools.packages.find]
where = ["src"]
include = ["austrianwindatlas*"]

[tool.setuptools.package-data]
austrianwindatlas = ["R/*.R", "configs/*.yaml"]

# -----------------------------------------------------------------------------
# tooling
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = [
    "E501",  # line length handled by formatter / line-length above
    "N803",  # argument name should be lowercase — uppercase M/L/S/U/V/X is
             # standard math convention in linear-algebra code (sklearn,
             # scipy and numpy all use it); the readability win is on the
             # math side here, not on the PEP8 side.
    "N806",  # variable in function should be lowercase — same reason.
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
