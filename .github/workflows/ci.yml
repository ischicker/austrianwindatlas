name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package (dev extras, no DL/GPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests examples

      - name: Pytest (unit)
        run: pytest tests/unit -q

      - name: Smoke import
        run: python -c "import austrianwindatlas as awa; print(awa.__version__)"

      - name: Run the end-to-end synthetic example
        run: python examples/01_synthetic_end_to_end.py

      - name: Check notebooks are in sync with their source scripts
        run: |
          pip install -q nbformat
          python notebooks/build_notebooks.py
          git diff --exit-code -- notebooks || {
            echo "notebooks/ is out of sync with examples/. Run 'python notebooks/build_notebooks.py' and commit."
            exit 1
          }
